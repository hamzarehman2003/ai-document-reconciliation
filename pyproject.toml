# Tool configuration only. Python packages are listed in requirements.txt.

[tool.ruff]
line-length = 88
target-version = "py312"
src = [".", "services/api"]

[tool.ruff.lint]
# E/W: PEP 8 style, F: errors, I: import order, N: PEP 8 naming,
# UP: modern Python syntax, B: common bugs.
select = ["E", "W", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.isort]
# services/api/alembic/ is our migrations folder; the "alembic" import is the library.
known-third-party = ["alembic"]
# Test helpers in services/api/tests/ imported as plain modules.
known-first-party = ["fakes"]

[tool.pytest.ini_options]
pythonpath = [".", "services/api"]
testpaths = ["services/api/tests", "scripts/generate_dataset/tests"]
