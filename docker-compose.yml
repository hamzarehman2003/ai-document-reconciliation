services:
  db:
    image: postgres:16
    container_name: invoiceiq-db
    restart: unless-stopped  # start again automatically when Docker restarts
    environment:
      POSTGRES_USER: invoiceiq
      POSTGRES_PASSWORD: invoiceiq
      POSTGRES_DB: invoiceiq
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoiceiq -d invoiceiq"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
